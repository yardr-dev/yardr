# SKETCH, not read by any yardr. The Linear adapter as a declared source
# whose logic is commands: internal/hooks/linear.go and the Linear halves of
# reply.go, open.go, state.go, forward.go and issue.go.
#
# Keys marked (today) exist in internal/source. Keys marked (new) do not.
#
# A command is a list, run without a shell, as `limits.command` is today.
# The contract is the one `limits` has: one JSON object on stdin, one on
# stdout, exit 0; anything else (another exit, a time limit, output that is
# no such object) is a failure the yard reports with the command's stderr.
# A path that does not start with / is a file of the pack, beside this one.
# What runs is the pack's choice: a shell script, the service's own CLI,
# `[lua, linear/thread.lua, state]`.

name: linear            # (today) refused today: source.BuiltIn holds the name
about: Linear issues and comments. Hears its webhooks, answers in threads, sets an issue's status.

# (today) the name of the variable, never the value. New: a command gets it
# in its environment under this name, read from the env_file of whoever
# acts (the crew member in `as:`), and gets no other variable of the yard.
credential:
  env: LINEAR_API_KEY

# ---- what it sends us: hooks.Adapter -----------------------------------------

hook:
  # (new) Adapter.Verify stays data, checked by the core: the signing secret
  # is handed to no command, and an unverified body reaches none.
  verify:
    scheme: hmac-sha256
    signed: body
    signature: { header: Linear-Signature, encoding: hex }
    delivery:  { header: Linear-Delivery }
    timestamp: { body: webhookTimestamp, unit: ms, window: 1m }
  bodies: unique          # (new) Adapter.Bodies

  # (new) Adapter.Normalize. stdin {"headers":{…},"body":{…}}, stdout the
  # envelope (hooks.Envelope as JSON). It gets no credential.
  normalize: [linear/normalize]

# ---- what the yard does in it: Replier, Opener, Stater, Forwarder ------------
#
# (new) Each takes the values the interface's method takes today and prints
# what it returns. See linear/thread for all five.

thread:
  reply:  [linear/thread, reply]      # in  {thread, parent, body, key}      out {id, url}
  posted: [linear/thread, posted]     # in  {thread, key}                    out {id, url} or {}
  read:   [linear/thread, read]       # in  {thread}                         out {messages: [...]}
  place:  team                        # what `--in` is called in this source
  open:   [linear/thread, open]       # in  {in, title, body, key}           out {id, title, url}
  state:  [linear/thread, state]      # in  {thread, state}                  out {status, moved}
  states: [started, review, done]     # the words it has a status for (Forwarder.Places)

# ---- its issues as a bead's link: Linker -------------------------------------

link:                                 # (new) data: one pattern, two templates
  host: linear.app
  issue: '^/([^/]+)/issue/([A-Z][A-Z0-9]*-[0-9]+)'
  fixed: "https://linear.app/{1}/issue/{2}"
  thread: "{2}"

# ---- (today) what an agent may ask of it, through `yardr call` ---------------
# Unchanged, and separate from the above: declared HTTPS requests, granted
# one by one. A command is never something an agent calls.

base: https://api.linear.app
calls:
  viewer:
    kind: read
    request: { method: POST, path: /graphql, body: { query: "{ viewer { id name } }" } }
check: viewer
