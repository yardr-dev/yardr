# yard replies, opens a thread and sets a status in it. It says nothing of
# what a stage means there: that is the flow pack's (../flow-pack/pack.yaml).
#
#   pack.yaml
#   linear.yaml          the declaration
#   linear/normalize     the commands it names
#   linear/thread

name: linear
kind: source            # (new) beside git and dir: a pack for the yard, not for a depot

sources:
  linear:
    declaration: linear.yaml      # (today) this key, and for a source no other
