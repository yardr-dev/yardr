# PostHog as a declared source: what an agent may ask of it through
# `yardr call` (a HogQL query, the error tracking issues, one issue, the
# session recordings, one recording, a session's Replay Vision
# observations), what it sends in (a new error issue), and what the yard
# sets in it (an error issue's status, resolved when the bead fixing it
# lands). Two calls write: the destination, made once by the hook card,
# and the thread's state; the pack has no notify key, so the yard writes
# nothing else to PostHog. Its link key names an error issue's page for
# a bead's link, and writes nothing: a link is made from the URL alone.
#
# Checked against PostHog's docs and source on 20 October 2026: the query
# endpoint (posthog.com/docs/api/queries, and the generated query_create),
# the issues endpoints
# (products/error_tracking/backend/presentation/views/issues.py, routes.py,
# pagination.py), the users endpoint (posthog/api/user.py), the recordings
# endpoints (posthog/session_recordings/session_recording_api.py, the
# RecordingsQuery in posthog/schema.py), the observations endpoint
# (products/replay_vision/backend/api/observations.py, routes in
# products/replay_vision/backend/routes.py), the personal API key scopes
# (posthog/scopes.py, frontend/src/lib/scopes.tsx), the webhook destination
# template (nodejs/src/cdp/templates/_destinations/webhook/
# webhook.template.ts), the issue-created event, whose exception_props carry
# the triggering exception's $session_id
# (products/error_tracking/backend/temporal/lifecycle/side_effects.py and
# event_properties.py, products/cdp/backend/internal_events.py), the
# destination globals (posthog.com/docs/cdp/destinations/
# customizing-destinations) and the issue's and the replay's routes
# (products/error_tracking/manifest.tsx, products/replay/manifest.tsx).
#
# The destination call beside them, checked on 23 October 2026 at
# posthog/posthog f1c6477: the template's id and inputs (nodejs/src/cdp/
# templates/_destinations/webhook/webhook.template.ts), the functions
# endpoint, its create shape and its scope (products/cdp/backend/api/
# hog_function.py, posthog/scopes.py), the inputs' {value} shape and the
# filter shape (products/cdp/backend/validation.py), the issue-created
# internal event (products/error_tracking/backend/temporal/lifecycle/
# issue_created/activities.py) and the consumer that runs only internal
# destinations for internal events (nodejs/src/cdp/consumers/
# cdp-internal-event.consumer.ts, nodejs/src/cdp/schema/hogflow.ts).
#
# The register check beside it, checked on 24 October 2026 at the same
# pin: the list with its type filter (HogFunctionFilterSet), the full
# answers that carry the inputs (get_serializer_class), the search over
# the name and the description (safely_get_queryset, posthog/helpers/
# trigram_search.py: a literal match is exact, and exact is kept over
# similar) and the read scope (scope_object_read_actions,
# posthog/scopes.py), all in products/cdp/backend/api/hog_function.py
# unless said. A read answers secrets masked (mask_config_secrets), so
# the check matches the URL, never the secret.
#
# A command is a list, run without a shell. A path that does not start
# with / is a file beside this one, which `yardr source add` copies into
# the yard.
name: posthog
about: PostHog analytics and error tracking. Answers HogQL queries, lists error issues and session recordings, reads a session's Replay Vision observations, hears a new error issue.

# The name of the variable, never the value. A personal API key with the
# scopes query:read, error_tracking:read, error_tracking:write,
# user:read, session_recording:read, replay_scanner:read,
# hog_function:read and hog_function:write, sent as a Bearer token
# (posthog.com/docs/api/personal-api-keys). The write scopes are the
# destination call's, which the hook card makes once (with the read scope
# beside it for the check that lists what stands before a retry registers
# again), and the thread state's, which resolves an error issue.
# hook.normalize is handed no credential at all.
credential:
  env: POSTHOG_API_KEY
  header: "Authorization: Bearer {credential}"

# ---- what it sends us ----------------------------------------------------

hook:
  # Adapter.Verify stays data, checked by the core: the secret is handed
  # to no command, and an unverified body reaches none. The destination
  # signs nothing yardr can check (its signing secret follows the Standard
  # Webhooks spec, which is base64 over id.timestamp.body, and yardr's
  # hmac-sha256 is hex over body or timestamp and body), so the secret
  # goes in a header of the destination's secret headers instead, compared
  # as it arrives. The delivery id is the event's uuid, one per transition,
  # so a retry is told however it re-serializes the body.
  verify:
    scheme: secret
    signature: { header: X-Yardr-Secret }
    delivery:  { body: event.uuid }
  bodies: unique
  # PostHog's deliveries follow its alerts, not a rhythm, so silence is never quiet.
  untimed: true

  # The yard registers the destination itself on the hook card: it makes
  # the secret, asks for the project id in the clear, and POSTs the
  # destination with the public URL and the secret in its secret headers.
  # A retry first lists what stands and adopts the destination already
  # aimed at the hook, so a call PostHog took but never answered is not
  # made twice.
  register:
    call: destination
    url: url
    secret: secret
    ask: [project]
    existing: { call: destinations, in: results, field: inputs.url.value }

  # Adapter.Normalize. stdin {"headers":{…},"body":{…}}, stdout the
  # envelope. The core sets source and delivery itself.
  normalize: [posthog/normalize]

  # The keys its events' fields may carry: a subscription's --where may
  # name them beside type, action, team, project, repo and label. project
  # is the id the destination's body carries under project (the setup adds
  # it beside the default {event, person}, which names no project). session
  # is the triggering exception's $session_id, which the issue-created
  # event carries under exception_props when the SDK set one, and replay
  # the replay link built from it, on the host that sent the delivery.
  # survey, email, footplate_version and os are what a `survey sent`
  # event carries ($survey_id, the sender's email, the footplate version
  # and the OS), which a feedback subscription filters on.
  keys: [project, session, replay, survey, email, footplate_version, os]

# ---- what the yard sets in its threads ------------------------------------
# An error issue's status, resolved when the bead fixing it lands: started
# is active, done is resolved. The call takes the thread's id, the project
# and the issue's UUID the link key reads (48291:<uuid>), and PATCHes the
# issue the issue call reads. Suppressed stands past every status: forward
# never moves one, and only a direct set reopens it. No reply, open or read
# key: an issue takes no comment for them (the viewset's actions at
# posthog/posthog 7c5ab18, 14 November 2026), so the yard sets statuses
# and speaks nothing in threads.
thread:
  state:  [posthog/thread, state]   # in  {thread, state, forward?}        out {status, moved, was?}
  states: [started, done]            # the words it has a status for: active or resolved

# ---- its issues as a bead's link ------------------------------------------
# The host of the default base, an error issue's page under its project,
# and over the groups: the issue's one fixed form, and the id a thread
# command takes for it (the project and the UUID the issue call takes as
# its params). The page is /project/<id>/error-tracking/<uuid>, as the
# hook's normalize builds it (products/error_tracking/manifest.tsx,
# checked 14 November 2026 at posthog/posthog 7c5ab18). A yard on the EU
# cloud reads and moves its issues by the same path, and a link matches
# either cloud's host, keeping the one the URL arrived on.
link:
  host: us.posthog.com
  issue: '^/project/([0-9]+)/error-tracking/([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})(?:/.*)?$'
  fixed: "https://us.posthog.com/project/{1}/error-tracking/{2}"
  thread: "{1}:{2}"

# ---- (today) what an agent may ask of it, through `yardr call` ------------
# Declared HTTPS requests, granted one by one. A command is never something
# an agent calls. Every call's project is the id the project's settings
# show, the team id the /api/projects/ routes take.

# The cloud the calls go to: the US base, unless the yard set the EU one
# (`yardr source set posthog base=eu`, or `yardr pack apply posthog
# --source-base posthog=eu`, which a re-apply keeps). The hook needs no
# such setting: the issue's URL is built from the project.url the
# delivery carries, on whichever host sent it.
base: https://us.posthog.com
bases:
  us: https://us.posthog.com
  eu: https://eu.posthog.com
calls:
  # The hook card's own call, granted to none: it makes the webhook
  # destination the hook hears through, from the webhook template, as an
  # internal destination (only those run for internal events), enabled,
  # firing on the issue-created event alone, with the delivery's body the
  # setup's {event, person, project} and the secret in its secret headers.
  # The operator deletes the destination in PostHog when the hook goes.
  destination:
    kind: update
    about: Make the webhook destination the hook hears through
    params:
      project: { type: string, pattern: "^[0-9]+$", max: 20, log: true }
      url: { type: string, max: 2048 }
      secret: { type: string, max: 256 }
      # The delivery's body, fixed by the file: PostHog's templating
      # globals for the event, the person and the project. They are
      # parameters only because a request body writes no literal {name}:
      # each default is sent as it stands, and the hook card asks for
      # none of them. project stays the global (normalize reads the URL
      # it renders), not the project id above.
      event_global: { type: string, default: "{event}" }
      person_global: { type: string, default: "{person}" }
      project_global: { type: string, default: "{project}" }
    request:
      method: POST
      path: /api/projects/{project}/hog_functions/
      body: {
        name: "yardr",
        description: "Sends new error issues to the yard's hook.",
        type: "internal_destination",
        template_id: "template-webhook",
        enabled: true,
        inputs: {
          url: { value: "{url}" },
          method: { value: "POST" },
          body: { value: { event: "{event_global}", person: "{person_global}", project: "{project_global}" } },
          secret_headers: { value: { X-Yardr-Secret: "{secret}" } },
        },
        filters: { source: "internal-events", events: [{ id: "$error_tracking_issue_created", type: "events" }] },
      }
  # The hook card's check before it registers again: the internal
  # destinations named yardr, with their inputs, of which a retry adopts
  # the one already aimed at the hook instead of making another. A list
  # answers without inputs unless full is asked, and the search holds
  # the answer to the name; the card matches the URL. A read, granted
  # with the rest.
  destinations:
    kind: read
    about: List the internal destinations named yardr, with their inputs
    params:
      project: { type: string, pattern: "^[0-9]+$", max: 20, log: true }
    request:
      method: GET
      path: /api/projects/{project}/hog_functions/
      query: { type: internal_destination, full: "true", search: yardr }
    # The page's results, each with its inputs: what the check scans. A
    # full destination carries its inputs' schema beside its inputs, and
    # a handful run past the 64 KB a call otherwise returns.
    answer: { select: [results], max: 262144 }
  query:
    kind: read
    about: Run a HogQL query, answered with its columns and rows
    params:
      project: { type: string, pattern: "^[0-9]+$", max: 20, log: true }
      hogql: { type: string, max: 8192 }   # free text: its value is in no event
    request:
      method: POST
      path: /api/projects/{project}/query/
      body: { query: { kind: "HogQLQuery", query: "{hogql}" }, name: "yardr" }
    # Results and their columns; a name the query_log shows the query
    # under, as the docs ask. A result table runs past the 64 KB a call
    # otherwise returns, and a larger one is refused, not cut.
    answer: { select: [results, columns], max: 262144 }
  issues:
    kind: read
    about: List the error tracking issues, 25 by default
    params:
      project: { type: string, pattern: "^[0-9]+$", max: 20, log: true }
      limit: { type: string, pattern: "^([1-9][0-9]?|100)$", default: "25" }   # 1 to 100, always sent, 25 unless given (PostHog's own default is 100)
      offset: { type: string, pattern: "^[0-9]{1,9}$", optional: true }
    request:
      method: GET
      path: /api/projects/{project}/error_tracking/issues/
      query: { limit: "{limit}", offset: "{offset}" }
    # The standard {count, next, previous, results} page; a page of issues
    # runs past the 64 KB a call otherwise returns. The list takes no
    # status filter, so every status comes back and the caller keeps what
    # it wants.
    answer: { select: [count, next, results], max: 262144 }
  issue:
    kind: read
    about: Read one error tracking issue
    params:
      project: { type: string, pattern: "^[0-9]+$", max: 20, log: true }
      id: { type: string, pattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$", max: 36, log: true }   # the issue's UUID
    request:
      method: GET
      path: /api/projects/{project}/error_tracking/issues/{id}/
    # The whole issue, as the read serializer has it: id, status,
    # severity, name, description, first_seen, assignee, external_issues
    # and cohort. One issue never nears the 64 KB a call returns.
  recordings:
    kind: read
    about: List the session recordings, 50 by default
    params:
      project: { type: string, pattern: "^[0-9]+$", max: 20, log: true }
      person_uuid: { type: string, pattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$", max: 36, optional: true }   # one person's UUID
      session_ids: { type: string, max: 2048, optional: true }   # a JSON list of session UUIDs, ["<id>"]: the list reads each query value as JSON
      date_from: { type: string, max: 64, optional: true }   # ISO or relative (-3d, the default when left out)
      date_to: { type: string, max: 64, optional: true }
      limit: { type: string, pattern: "^([1-9]|[1-4][0-9]|50)$", optional: true }   # 1 to 50; PostHog's own default is 50
      after: { type: string, max: 512, optional: true }   # the cursor the previous answer's next_cursor holds
    request:
      method: GET
      path: /api/projects/{project}/session_recordings/
      query:
        person_uuid: "{person_uuid}"
        session_ids: "{session_ids}"
        date_from: "{date_from}"
        date_to: "{date_to}"
        limit: "{limit}"
        after: "{after}"
    # {results, has_next, next_cursor}: the recordings' metadata (id,
    # distinct_id, person, duration, times, start_url, counts, ongoing),
    # whether more follow, and the cursor for them. A page runs past the
    # 64 KB a call otherwise returns.
    answer: { select: [results, has_next, next_cursor], max: 262144 }
  recording:
    kind: read
    about: Read one session recording's metadata
    params:
      project: { type: string, pattern: "^[0-9]+$", max: 20, log: true }
      id: { type: string, pattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$", max: 36, log: true }   # the session's UUID
    request:
      method: GET
      path: /api/projects/{project}/session_recordings/{id}/
    # The whole recording, as the read serializer has it: id, distinct_id,
    # person, duration, times, start_url, counts, ongoing and the rest.
    # One recording never nears the 64 KB a call returns.
  observations:
    kind: read
    about: Read a session's Replay Vision observations, in words
    params:
      project: { type: string, pattern: "^[0-9]+$", max: 20, log: true }
      session_id: { type: string, pattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$", max: 36, log: true }   # the session's UUID
    request:
      method: GET
      path: /api/projects/{project}/vision/observations/
      query: { session_id: "{session_id}" }
    # The standard {count, next, previous, results} page; each observation
    # carries its scanner's result in words (scanner_result.model_output's
    # title and summary) beside its one-line summary_line. A page runs
    # past the 64 KB a call otherwise returns. Only sessions a Replay
    # Vision scanner has run on have any.
    answer: { select: [count, next, results], max: 262144 }
  whoami:
    kind: read
    about: Whose personal API key the credential is
    request:
      method: GET
      path: /api/users/@me/
    answer: { select: [email] }
check: whoami
