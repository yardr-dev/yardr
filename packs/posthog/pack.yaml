# PostHog as a pack of kind source: the integration, imported into the yard
# and into no depot. What PostHog is: HogQL queries and error tracking
# issues an agent reads through `yardr call`, and the webhook that hears a
# new error issue. Nothing here writes to PostHog.
#
#   yardr pack apply posthog
#
# The source is named posthog: yardr knows PostHog as this pack alone.
name: posthog
kind: source
setup: SETUP.md

sources:
  posthog:
    declaration: posthog.yaml
