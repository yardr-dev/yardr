# Gmail as a pack of kind source: the integration, imported into the
# yard and into no depot. What Gmail is here: the declared source
# google-mail, which reads mail and threads and writes drafts, and
# sends nothing. Its credential mints from the operator's gws login,
# with contrib/google-mint as its mint_command, which the operator sets
# by hand: no pack brings the command. The login, the mint and calling
# as a user are the three google packs' shared setup, said once in
# docs/google.md.
#
#   yardr pack apply google-mail
#
# The source is named google-mail. A pack of kind source asks no grants
# at import, so the operator grants what a crew member may call
# afterwards, by the setup notes: read for the reads, each update by
# its name.
name: google-mail
kind: source
setup: SETUP.md

sources:
  google-mail:
    declaration: google-mail.yaml
