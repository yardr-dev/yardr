# Gmail as a declared source: reading mail and writing drafts, through
# users.messages, users.threads and users.drafts.create. What it never
# does is send: no messages.send, no drafts.send, no drafts.update, no
# drafts.delete, no modify of labels, no trash and no delete. Sending
# stays the person's; the yard writes the draft, the person presses send.
#
# Checked against the discovery document
# (https://www.googleapis.com/discovery/v1/apis/gmail/v1/rest) on 16
# October 2026: list takes q and maxResults (default 100) and answers
# one page with messages, nextPageToken and resultSizeEstimate; get
# takes format (minimal, full, raw, metadata; default full); threads.get
# takes the same formats but full, metadata and minimal; drafts.create
# takes {message: {raw}} and answers {id, message}.
#
# A credential that expires is minted, not kept: GOOGLE_ACCOUNT names
# the account (an address, no secret), and google-mint, the file beside
# this one, turns it into a token from the gws login on this machine:
# run with {inputs, scope} on stdin for a {token, expires_at}. The
# pack brings it (credential.mint_command), so applying the pack sets
# the mint with no command typed; the card shows its sha256, and a
# mint_command the operator sets on google-mail wins over it. The token
# is handed to each call under GOOGLE_TOKEN, and kept in memory alone.
# Gmail takes no idempotency key, so the file names none: a
# draft tried again after a lost answer is written twice.
name: google-mail
about: Gmail read and drafts. Searches, reads messages and threads, and writes drafts; sends nothing.
base: https://gmail.googleapis.com
credential:
  env: GOOGLE_TOKEN
  header: "Authorization: Bearer {credential}"
  mint: [GOOGLE_ACCOUNT]
  mint_command: [google-mint]       # the file beside this one; the source's own mint_command wins
calls:
  search:
    kind: read
    about: Search mail, one page of at most 50
    params:
      q: { type: string, max: 1000, optional: true }   # free text, Gmail's search syntax; left out, the newest mail
      maxResults: { type: string, pattern: "^([1-9]|[1-4][0-9]|50)$" }   # 1 to 50, always given: Gmail's own default is 100
    request:
      method: GET
      path: /gmail/v1/users/me/messages
      query: { q: "{q}", maxResults: "{maxResults}" }
    answer: { select: [messages, nextPageToken, resultSizeEstimate] }   # nextPageToken says there is more; paging is left out, so one page is all a call reads
  message:
    kind: read
    about: Read one message, headers alone or with its text
    params:
      id: { type: string, pattern: "^[0-9a-f]+$", max: 64, log: true }
      format: { type: enum, values: [metadata, full] }   # metadata keeps the headers, full keeps the text part too
    request:
      method: GET
      path: /gmail/v1/users/me/messages/{id}
      query: { format: "{format}" }
    answer: { select: [id, threadId, labelIds, snippet, payload], max: 262144 }   # headers and the text part are in payload
  thread:
    kind: read
    about: Read one thread, whole
    params:
      id: { type: string, pattern: "^[0-9a-f]+$", max: 64, log: true }
      format: { type: enum, values: [metadata, full] }
    request:
      method: GET
      path: /gmail/v1/users/me/threads/{id}
      query: { format: "{format}" }
    answer: { select: [id, messages], max: 524288 }
  draft:
    kind: update
    about: Write a draft, never send one
    params:
      # Two shapes, never mixed: to, subject and body, with cc and a
      # thread to answer beside them, or raw alone. Every field is
      # optional here so raw alone reaches the build script, which
      # refuses a shape that is neither and builds the raw message
      # itself; "never sends" stands.
      to: { type: string, pattern: "^[^@[:space:]]+@[^@[:space:]]+$", max: 254, optional: true, log: true }   # one address, as drive's share takes one
      cc: { type: string, pattern: "^[^@[:space:]]+@[^@[:space:]]+$", max: 254, optional: true, log: true }   # one address beside to, or none
      subject: { type: string, max: 500, optional: true }   # free text, as long as calendar's summary; encoded where it is not ASCII
      body: { type: string, max: 100000, optional: true }   # plain text; even 4 UTF-8 bytes per character plus MIME and base64 fits the 1 MiB build bound
      thread: { type: string, pattern: "^[0-9a-f]+$", max: 64, optional: true, log: true }   # the thread the draft answers, whose last message the script reads for its reply headers
      # The escape hatch: the whole RFC 2822 message (headers, a blank
      # line, the body), base64url-encoded with or without padding,
      # wrapped untouched. How to make one is in the pack's SETUP.md.
      # At most a million characters, about 750 KB of message, under
      # Gmail's 35 MB.
      raw: { type: string, pattern: "^(?:[A-Za-z0-9_-]{4})*(?:[A-Za-z0-9_-]{2}(?:==)?|[A-Za-z0-9_-]{3}=?|[A-Za-z0-9_-]{4})$", max: 1000000, optional: true }
    request:
      method: POST
      path: /gmail/v1/users/me/drafts
    build: [build-draft]
    answer: { select: [id, message] }
