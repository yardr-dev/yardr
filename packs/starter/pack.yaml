# Starter pack for yardr: one yard's way of working, as one file.
# It names no agent product, model, depot, person or secret. Those are asked
# for when the pack is imported and stay in the yard.

name: starter

# The kind of depot the pack is for: its flow lands a bead on a base branch.
kind: git

# Flows, by name. A depot uses one of them; the import asks which, and the first
# is the default. A flow with "type:" applies to beads of that type only, next
# to the depot's flow (a train flow beside the task flow, say).
#
# Each flow lists the stages a bead passes through; the first is where a new
# bead starts.
#   group:   who works the stage (declared below)
#   file:    the stage file: what the stage is for, what must be true to leave
#            it and when each outcome applies, shown to whoever works a bead there
#   outcomes: outcome reported -> next stage
#   manual:  stages a person or a crew member may move the bead to by hand
#   end:     the bead closes here
#
# The reviewer sends a bead past the second review, for security alone, with
# the outcome done-safe. A depot may list in .yardr/security_paths, a file of its
# repository, the paths whose change must always have it: the yard then refuses
# done-safe for a diff that touches one. The pack ships no list, since the
# paths are the depot's, and without one done-safe is taken as it stands. See
# the README.
flows:
  default:
    stages:
      backlog:  { group: backlog,   file: flows/default/backlog.md,  manual: [new, decide] }
      new:      { group: builders,  file: flows/default/new.md,      outcomes: { done: review, question: decide }, manual: [backlog] }
      review:   { group: reviewers, file: flows/default/review.md,   outcomes: { done: review-security, done-safe: approved, changes: new, question: decide } }
      review-security: { group: security-reviewers, file: flows/default/review-security.md, outcomes: { done: approved, changes: new, question: decide } }
      approved: { group: assembly,  file: flows/default/approved.md, outcomes: { done: merged, failed: new, question: decide } }
      decide:   { group: decisions, file: flows/default/decide.md,   manual: [backlog, new] }
      merged:   { end: true }

  # Trains have their own path through review and landing. A GitHub hook's
  # says table reports merged, changes, question, and CI outcomes for the
  # train; these edges keep that table in data alongside the flow. A train is
  # reviewed once, then once more for security alone, both on the whole of its
  # diff: there is no done-safe past the second review.
  train:
    type: train
    stages:
      backlog: { group: backlog, manual: [open] }
      open:    { group: builders, outcomes: { done: review, failed: open, conflict: merge, question: decide }, manual: [backlog] }
      review:  { group: reviewers, outcomes: { done: review-security, changes: open, question: decide } }
      review-security: { group: security-reviewers, outcomes: { done: approved, changes: open, question: decide } }
      approved: { group: assembly, outcomes: { done: in-pr, failed: open, conflict: merge, changes: open, question: decide, merged: merged } }
      in-pr:   { group: decisions, outcomes: { done: land, changes: open, question: decide, merged: merged } }
      land:    { group: assembly, outcomes: { done: merged, failed: open, question: decide, merged: merged } }
      merge:   { group: decisions, outcomes: { done: open, rework: open, question: decide } }
      decide:  { group: decisions, manual: [open, backlog] }
      merged:  { end: true }

# A group is exactly one of: an agent with a role, a script, or people.
# limit is how many beads it works at once.
#   binds_as: an agent group declared before this one, whose agent, model and
#             permission arguments this group gets, as the yard has them or
#             as the import binds them, so the import asks nothing for this
#             one: the second review is run by the agent the first is, unless
#             the import is given --bind security-reviewers=<kind>[:<model>]
groups:
  builders:  { agent: roles/builder.md,  limit: 5 }
  reviewers: { agent: roles/reviewer.md, limit: 3 }
  security-reviewers: { agent: roles/review-security.md, limit: 2, binds_as: reviewers }
  assembly:  { run: scripts/merge-local, limit: 1 }
  backlog:   { people: true }
  decisions: { people: true }

# Always-on sessions, by name. None is required; a yard may run without one,
# with several, or under another name (the import asks which crew member of the
# yard takes each of these).
#
#   hears:      what it hears from the yard itself
#     events:   kinds of event, or attention: the kinds that need someone
#               (something went wrong, a bead was held, ...), whichever they
#               are in the yardr that runs
#     stages:   a bead enters one of these stages (must exist in a flow above)
#     done:     a bead closed
#   subscribe:  what it hears from outside sources, and how much:
#               involved (mentioned, assigned, or already in the thread),
#               mentions, or all
#   open_threads: the outside sources it should be able to open a thread in
#               of its own accord (linear, github). A pack only asks: the
#               import puts the question to the yard's operator, and only for
#               a source the yard is set up for
crew:
  yardmaster:
    role: roles/yardmaster.md
    hears:
      events: [attention]
      stages: [decide]
      done: true
    subscribe:
      linear: involved
    open_threads: [linear]

# What an outside source hears of the flows above: when a bead that tracks
# one of its issues (yardr link) enters a stage, the issue goes to a status.
#
#   as:     the crew member above the status is set as, with its credential
#   hears:  bead type -> stage -> started, review or done. A stage left out
#           changes nothing, and an issue is only ever moved forward
#
# The import sets this on the yard's hook of the source. It makes no hook,
# and it does not let the crew member set a status: the operator grants that
# (set_state), and until then nothing is moved.
#
# The other way round, what a source's events say of a bead: an event about
# a train's pull request (GitHub's, by the branch yard/<train>) reports an
# outcome for the train, as a session does with yardr bead done --outcome,
# and the flow above routes it. No stage is named as where the train goes.
#
#   says:   lines, the first an event matches counts
#     where:    the events the line is for, as a subscription's --where:
#               key=value words that must all hold, a key given twice
#               holding either value. The keys are the source's, and stage
#               and type: the stage the bead is in and its type, for a line
#               that holds in some stages or for some types only. The
#               event's own type is named with event there
#     outcome:  what such an event reports. A stage with no edge for it
#               refuses, and the train's events show the refusal
#     note:     optional, the words the move's note begins with
#
# So here: a pull request merged by hand says merged from approved, in-pr or
# land, one closed unmerged asks a person, and changes a person requests or
# a failed run on its head send a train under review back to open. CI green
# or red in in-pr is read as state and put to the same table.
#
# The import sets this on the yard's hook of the source too. The event=ci
# lines read CI back through the source's ci command, which runs with a
# crew member's credential: the hook acts as yardmaster for them.
sources:
  linear:
    as: yardmaster
    hears:
      task: { new: started, review: review, review-security: review, merged: done }
  github:
    as: yardmaster
    says:
      - { where: "event=pull_request action=closed merged=true", outcome: merged, note: "PR merged" }
      - { where: "event=pull_request action=closed merged=false", outcome: question, note: "PR closed unmerged: reopen, or drop the train?" }
      - { where: "event=pull_request_review action=submitted state=changes_requested sender=user", outcome: changes, note: "Changes requested on the PR" }
      - { where: "event=workflow_run event=check_suite action=completed conclusion=failure conclusion=timed_out stage=review stage=review-security", outcome: changes, note: "CI failed on the head of the PR" }
      - { where: "event=ci conclusion=success stage=in-pr", outcome: done }
      - { where: "event=ci conclusion=failure stage=in-pr", outcome: changes }
