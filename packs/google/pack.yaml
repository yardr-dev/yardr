# Google as a pack of kind source: the integration, imported into the
# yard and into no depot. What Google is here: four declared sources,
# one per host, for Gmail, Drive, Docs and Slides. Gmail reads mail and
# writes drafts, and sends nothing; Drive lists and reads files and
# makes folders and empty Docs and Slides; Docs reads documents and
# appends text with a style; Slides reads decks and appends slides with
# title and body. Each source's credential mints from the operator's gws
# login, with contrib/google-mint as its mint_command, which the
# operator sets by hand: no pack brings the command.
#
#   yardr pack apply google
#
# The sources are named google-mail, google-drive, google-docs and
# google-slides. A pack of kind source asks no grants at import, so the
# operator grants what a crew member may call afterwards, by the setup
# notes: read for the reads, each update by its name.
name: google
kind: source
setup: SETUP.md

sources:
  google-mail:
    declaration: google-mail.yaml
  google-drive:
    declaration: google-drive.yaml
  google-docs:
    declaration: google-docs.yaml
  google-slides:
    declaration: google-slides.yaml
