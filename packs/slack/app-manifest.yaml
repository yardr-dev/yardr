# The yard's Slack app as one document, for the operator to paste where
# Slack creates an app from a manifest (api.slack.com/apps, Create New
# App, From a manifest), SETUP.md step 1. It names the bot user and the
# scopes, and deliberately no event subscriptions and no Request URL: a
# manifest that names events without a Request URL or Socket Mode does
# not validate, so the app is created before its hook address exists and
# the two bot events are subscribed in step 6, once the hook stands and
# Slack can verify its address.
#
# The scopes are the bot's alone, and only these six (section 3.7 step 1
# of docs/design/2026-10-17-yardr-pcxd-slack.md): app_mentions:read so
# the bot is told when it is mentioned, the four histories so
# conversations.replies reads a heard thread back on the bot token in
# each kind of conversation, and chat:write so it answers in the thread.
# mpim:history in particular is a reading scope only: it lets a heard
# group thread be read back, and no message.mpim event is ever
# subscribed, so it widens nothing that is heard.
_metadata:
  major_version: 1
display_information:
  name: yardr
features:
  bot_user:
    display_name: yardr
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - channels:history
      - groups:history
      - im:history
      - mpim:history
      - chat:write
settings:
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
