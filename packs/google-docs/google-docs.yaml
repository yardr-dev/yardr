# Google Docs as a declared source: a document read, appended to at the
# end with several styled paragraphs in one call, and replaced in place
# with a guarded find. One source per host, so Docs is its own; the empty
# file it fills is made by the drive source's doc call. No other
# batchUpdate request is declared.
#
# Checked against the discovery document
# (https://www.googleapis.com/discovery/v1/apis/docs/v1/rest) on 16
# October 2026: documents.get answers the document with title and body;
# documents.batchUpdate takes {requests} and answers {documentId,
# replies}. InsertText takes endOfSegmentLocation, which appends at the
# end of the body with no index; UpdateParagraphStyle takes a range, a
# paragraphStyle with namedStyleType (NORMAL_TEXT, TITLE, HEADING_1
# through HEADING_6) and fields, and styles the paragraphs the range
# overlaps. Indices are UTF-16 code units, so an astral character counts
# double; the write call's build script reads the document for its body's
# end index, works out each paragraph's range itself, and prints the
# batchUpdate that appends them. ReplaceAllText, checked on 17 October
# 2026, takes containsText with text and matchCase, and replaceText, and
# answers occurrencesChanged in its reply; the replace call's build
# script reads the document for its text, counts the matches itself, and
# refuses more than one unless all is true.
#
# The credential mints like google-mail's: GOOGLE_ACCOUNT names the
# account (an address, no secret) and google-mint, beside this file,
# mints from it, which the operator's own mint_command wins over. Docs
# takes no idempotency key, so the file names none: a write tried again
# after a lost answer is appended twice. A replace tried again counts
# again first, so it sends a second change only where the first left
# matches.
name: google-docs
about: Google Docs read and appended to, several styled paragraphs in one call, and replaced in place.
base: https://docs.googleapis.com
credential:
  env: GOOGLE_TOKEN
  header: "Authorization: Bearer {credential}"
  mint:
    - name: GOOGLE_ACCOUNT
      secret: false               # an address, asked in the clear
  mint_command: [google-mint]       # the file beside this one; the source's own mint_command wins
calls:
  doc:
    kind: read
    about: Read one document, title and text
    params:
      docId: { type: string, pattern: "^[A-Za-z0-9_-]+$", max: 200, log: true }
    request:
      method: GET
      path: /v1/documents/{docId}
    answer: { select: [title, body], max: 262144 }   # the text is in body's paragraphs
  write:
    kind: update
    about: Append paragraphs at the end, each with its style
    params:
      docId: { type: string, pattern: "^[A-Za-z0-9_-]+$", max: 200, log: true }
      # One JSON array of text/style pairs, the paragraphs to append:
      # [{"text":"Lunch places","style":"HEADING_1"}]. Each style is one
      # of NORMAL_TEXT, TITLE, HEADING_1, HEADING_2; NORMAL_TEXT writes
      # plain. Free text: its value is in no event. The build script
      # reads the document for its body's end index, works out each
      # paragraph's range itself, and prints the batchUpdate; the first
      # pair continues the doc's last paragraph, so on a doc with text
      # it styles that paragraph whole.
      paragraphs: { type: string, max: 60000 }
    request:
      method: POST
      path: /v1/documents/{docId}:batchUpdate
    build: [google-docs/build-write]
    answer: { select: [documentId, replies] }
  replace:
    kind: update
    about: Replace text in place, refusing more than one match unless told all
    params:
      docId: { type: string, pattern: "^[A-Za-z0-9_-]+$", max: 200, log: true }
      # The text to find, literal and case-sensitive; empty is refused by
      # the build script before the document is read. Free text: its value
      # is in no event.
      find: { type: string, max: 1000 }
      # The text that takes its place; empty deletes. Free text: its value
      # is in no event.
      with: { type: string, max: 60000 }
      # Left out, more than one match is refused in words that say the
      # count; true replaces them all. The build script reads the
      # document for its text, counts itself, and prints the batchUpdate,
      # pinned to the revision read; zero matches sends, and the answer's
      # occurrencesChanged of 0 says so.
      all: { type: bool, optional: true }
    request:
      method: POST
      path: /v1/documents/{docId}:batchUpdate
    build: [google-docs/build-replace]
    answer: { select: [documentId, replies] }   # replies carry replaceAllText.occurrencesChanged
