# Docs and Slides as a pack of kind source: the integration, imported
# into the yard and into no depot. What they are here: the declared
# sources google-docs and google-slides, which read documents and
# decks and append text and slides to them. Each source's credential
# mints from the operator's gws login, with contrib/google-mint as its
# mint_command, which the operator sets by hand: no pack brings the
# command. The login, the mint and calling as a user are the three
# google packs' shared setup, said once in docs/google.md.
#
#   yardr pack apply google-docs
#
# The sources are named google-docs and google-slides. A pack of kind
# source asks no grants at import, so the operator grants what a crew
# member may call afterwards, by the setup notes: read for the reads,
# each update by its name.
name: google-docs
kind: source
setup: SETUP.md

sources:
  google-docs:
    declaration: google-docs.yaml
  google-slides:
    declaration: google-slides.yaml
