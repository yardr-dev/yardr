# GitHub as a pack of kind source: the integration, imported into the yard
# and into no depot. What GitHub is: how its webhooks are verified and
# read, how the yard replies, opens a thread and sets a status in it, and
# how it reads a pull request and its CI back.
# What a stage means there is the flow pack's to say (sources.<name>:
# hears); until the yard has this source, an import of that pack skips the
# lines, and the next apply sets them.
#
#   yardr pack apply github
#
# The source is named github. While its Go adapter is still compiled in,
# the declared one wins every lookup when the yard has it; the apply
# folds what the yard recorded under github-declared into github.
name: github
kind: source
setup: SETUP.md

sources:
  github:
    declaration: github.yaml
