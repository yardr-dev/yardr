<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
{{- /* htmx would add a <style> of its own, which the page's policy refuses. */}}
<meta name="htmx-config" content='{"includeIndicatorStyles":false,"allowEval":false}'>
<title>{{.Title}} · {{.Yard}}</title>
<link rel="stylesheet" href="{{asset "yard.css"}}">
<script src="{{asset "htmx.min.js"}}" defer></script>
<script src="{{asset "htmx-ext-sse.min.js"}}" defer></script>
<script src="{{asset "yard.js"}}" defer></script>
</head>
<body>
{{- /* The window: the rail of the four modes, the open mode's list, and the
       stage that holds the page. Every address answers all three, so a
       pasted link, a reload and a first visit look as a click does, and
       nothing here needs script to be read or used: htmx makes the same
       click cheaper. One stream for the page (a browser allows a host few
       connections), in the format the page asks for (Page.stream); an error
       page has no stream. The attributes of the shell are the swap's
       contract (docs/web.md, Swaps): a link inside swaps the stage with the
       new page's and, out of band, the rail, the drawer's marker and the
       list's head and rows, which leaves the list element, and its scroll,
       where it is; a block whose links all leave the mode says so and has
       the whole list swapped, so the new mode's list starts at its top. The
       stage scrolls to its top with each swap that is a navigation or an
       answer, as a page loaded plainly starts there; a live read says its
       own swap and leaves it where it is. The server sends the same whole
       page to every request, htmx's included, and hx-select picks the
       stage. */}}
<div class="wv-shell"{{if not .Bare}} hx-ext="sse" sse-connect="/events?after={{.Head}}{{with .Stream}}&amp;format={{.}}{{end}}"{{end}} hx-boost="true" hx-push-url="true" hx-target="#stage" hx-select="#stage > *" hx-select-oob="#rail:outerHTML,#drawer:outerHTML,#list-head:innerHTML,#list-rows:innerHTML" hx-swap="innerHTML scroll:top">
  {{- /* The rail: the yard's chip, which opens Decide, the three modes, and
         Settings at the foot. A tile carries the count of what its mode
         waits on, in words in its title and aria-label. The glyphs are
         footplate's own drawings on its 24-grid, in the current colour.
         Under 900 px it is the bar at the foot, without the chip. */}}
  <nav class="wv-rail" id="rail" aria-label="Modes" hx-select-oob="#rail:outerHTML,#drawer:outerHTML,#list:outerHTML">
    <a class="wv-chip" href="/" title="{{.Yard}}" aria-label="{{.Yard}}">{{.Rail.Chip}}</a>
    {{- range .Rail.Tiles}}{{if ne .Name "settings"}}{{template "tile" .}}{{end}}{{end}}
    <span class="wv-rail__foot"></span>
    {{- range .Rail.Tiles}}{{if eq .Name "settings"}}{{template "tile" .}}{{end}}{{end}}
  </nav>
  {{- /* The drawer's marker: under 900 px the list is a drawer, which
         #drawer in the address opens (:target, no script). A swap that
         brings a new marker shuts it; a live read leaves it. */}}
  <span id="drawer" class="wv-flag"></span>
  {{- /* The list: what stands in the open mode, with the open row marked.
         An error page has the head alone. */}}
  <nav class="wv-list" id="list" aria-labelledby="list-title">
    <header class="wv-list__head" id="list-head">
      <div class="wv-list__top"><h2 id="list-title">{{.List.Title}}</h2>{{with .List.Count}}<span class="wv-list__count">{{if $.List.Wait}}<span class="wv-wait">{{.}}</span>{{else}}{{.}}{{end}}</span>{{end}}<a class="wv-list__close" href="#stage">Close</a></div>
      {{- with .List.Sub}}
      <p class="wv-list__sub">{{.}}</p>
      {{- end}}
    </header>
    <div class="wv-list__rows" id="list-rows">
      {{- range .List.Sections}}{{template "section" .}}{{end}}
    </div>
  </nav>
  <a class="wv-scrim" href="#stage" aria-label="Close the list"></a>
  {{- /* The stage: the phone's top bar, the page's leaf where it is live,
         and the page itself, which draws its own head where it is of a
         stage kind (Page.Kind) and has the shell's heading above it where it
         is not yet. The leaf is childless, since htmx's attributes
         inherit and these would otherwise reach every link of the page: it
         reads the page's own address again at every event of the stream,
         and puts the stage, the rail and the list's head and rows in place
         with no marker, so a drawer that is open stays open. A page that
         is a snapshot has none. */}}
  <main class="wv-stage" id="stage">
    <div class="wv-top">
      <a class="wv-chip" href="/" title="{{.Yard}}" aria-label="{{.Yard}}">{{.Rail.Chip}}</a>
      <span class="wv-top__mode">{{.List.Title}}</span>{{with .List.Count}}<span class="wv-top__count">{{.}}</span>{{end}}
      <a class="wv-top__list" href="#drawer">List<svg class="wv-glyph wv-chev" width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></a>
    </div>
    {{- with .Live}}
    <i class="wv-live" hidden hx-get="{{$.Self}}" hx-trigger="sse:message" hx-push-url="false" hx-swap="{{.}}" hx-select-oob="#rail:outerHTML,#list-head:innerHTML,#list-rows:innerHTML"></i>
    {{- end}}
    {{- if not .Kind}}
    <header class="page-head"><h1>{{.Title}}</h1></header>
    {{- end}}
    {{template "content" .}}
  </main>
</div>
</body>
</html>
{{define "tile"}}
<a class="wv-tile" href="{{.Path}}" title="{{.Title}}" aria-label="{{.Aria}}"{{if .Open}} aria-current="true"{{end}}>
  {{- if eq .Glyph "lamp"}}
  <svg class="wv-glyph" viewBox="0 0 24 24" aria-hidden="true"><line x1="12" y1="21" x2="12" y2="13"/><circle cx="12" cy="7" r="4"/></svg>
  {{- else if eq .Glyph "semaphore"}}
  <svg class="wv-glyph" viewBox="0 0 24 24" aria-hidden="true"><line x1="6" y1="21" x2="6" y2="4"/><line x1="6" y1="5" x2="17" y2="11"/><circle class="solid" cx="6" cy="4" r="1.4"/></svg>
  {{- else if eq .Glyph "track"}}
  <svg class="wv-glyph" viewBox="0 0 24 24" aria-hidden="true"><line x1="7" y1="1.5" x2="7" y2="22.5"/><line x1="17" y1="1.5" x2="17" y2="22.5"/><line x1="4.5" y1="5.5" x2="19.5" y2="5.5"/><line x1="4.5" y1="12" x2="19.5" y2="12"/><line x1="4.5" y1="18.5" x2="19.5" y2="18.5"/></svg>
  {{- else}}
  <svg class="wv-glyph" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><circle cx="12" cy="12" r="7" stroke-dasharray="3 2.5"/></svg>
  {{- end}}
  <span class="wv-tile__label">{{.Label}}</span>
  {{- with .Badge}}<span class="wv-badge" aria-hidden="true">{{.}}</span>{{end}}
</a>
{{end}}
{{- /* The chevron: a fold's, and the back link's turned round. */}}
{{define "chev"}}<svg class="wv-glyph wv-chev" width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>{{end}}
{{- /* The check: what stands in the dot column of a row that has closed. */}}
{{define "check"}}<svg class="wv-glyph wv-check" width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.5 2.5L16 9.5"/></svg>{{end}}
{{- /* A section of the list: a fold with its title and count, or bare rows
       (a mode's places). A depot's title links to its page. */}}
{{define "section"}}
{{- if .Bare}}
<ul class="wv-places">
  {{- range .Rows}}
  <li>{{template "row" .}}</li>
  {{- end}}
</ul>
{{- else}}
<details class="wv-sect"{{if not .Fold}} open{{end}}>
  <summary><svg class="wv-glyph wv-chev" width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>{{if .Href}}<a href="{{.Href}}"{{if .Current}} aria-current="page"{{end}}>{{.Title}}</a>{{else}}<span>{{.Title}}</span>{{end}}{{with .Count}}<span class="wv-sect__count">{{.}}</span>{{end}}</summary>
  <ul{{if .Leaves}} hx-select-oob="#rail:outerHTML,#drawer:outerHTML,#list:outerHTML"{{end}}>
    {{- range .Rows}}
    <li>{{template "row" .}}</li>
    {{- else}}
    {{- with .Empty}}
    <li class="wv-list__none">{{.}}</li>
    {{- end}}
    {{- end}}
  </ul>
</details>
{{- end}}
{{end}}
{{- /* One row of the list: the dot column is always there, empty where the
       row has no dot; the lines under the name are quiet. */}}
{{define "row"}}<a class="wv-row{{if .Unread}} wv-row--unread{{end}}" href="{{.Href}}"{{if .Current}} aria-current="page"{{end}}>
  <span class="wv-dot{{with .Dot}} wv-dot--{{.}}{{end}}"></span>
  <span class="wv-row__main">
    <span class="wv-row__name">{{.Name}}</span>
    {{- range .Lines}}
    <span class="wv-row__meta">{{range $i, $p := .}}{{if $i}} · {{end}}{{if $p.Code}}<code>{{$p.Text}}</code>{{else if $p.Class}}<span class="wv-{{$p.Class}}">{{$p.Text}}</span>{{else}}{{$p.Text}}{{end}}{{end}}</span>
    {{- end}}
  </span>
  <span class="wv-row__end{{if .EndWait}} wv-row__end--wait{{end}}">{{.End}}</span>
</a>{{end}}
