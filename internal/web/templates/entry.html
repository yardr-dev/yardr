{{- /* One event of the feed, one line: what happened, the bead, its title
       and when. On the home page, and alone as an event of the stream. */ -}}
{{define "entry"}}
<article class="item entry entry-line" id="e{{.Seq}}">
  <p class="entry-what"><span{{if .Tone}} class="{{.Tone}}"{{end}}>{{.Text}}</span>{{if .Bead}}<a class="bead" href="/beads/{{.Bead}}">{{.Bead}}</a>{{end}}{{if .Title}}<span class="separator" aria-hidden="true">·</span><span class="entry-title">{{.Title}}</span>{{end}}<span class="separator" aria-hidden="true">·</span><time class="label" datetime="{{.At.UTC.Format "2006-01-02T15:04:05Z"}}">{{.Clock}}</time></p>
</article>
{{end}}
