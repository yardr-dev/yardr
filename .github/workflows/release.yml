name: release

# A pushed tag v* tests, builds, attests and drafts the release: the same
# test jobs as ci.yml, then the two linux archives and checksums.txt built
# reproducibly (install.sh is copied beside them, in no archive), an SBOM
# of the source, build-provenance attestations for the archives, and a
# draft release holding the files. The darwin archives are none of this
# workflow's: they are signed with a Developer ID and notarized by Apple,
# so the yard's release flow builds them on a Mac that holds the identity
# and adds them to the draft, with checksums.txt made whole. The flow pushes
# the tag and waits for the draft (docs/install.md, "Making a release");
# mckean signs the draft's checksums by hand, and the flow publishes the
# draft once the signature verifies. Run by hand
# (workflow_dispatch) it is a dry run: the same tests and the same build,
# the archives and the SBOM kept as workflow artifacts, and nothing
# attested or published.
#
# Every uses: below is pinned by full commit SHA, with the release it is
# as a comment; a tag that moves would run code no review saw.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The same three test jobs as ci.yml's, with the same limits; keep the two
  # in step. The build waits for all three, so a draft means each passed.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # go-version-file pins the toolchain go.mod names; cache keeps the
      # module and build caches keyed on go.sum.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "gofmt needed on:"
            echo "$out"
            exit 1
          fi
      # The depot's test command as the assembly runs it on what lands: go
      # vet, go test -race over every package, and the store/dispatch/bdp
      # suites again through the unix-socket client. It is the whole suite
      # here because the checkout has no base to compare with. Running the
      # script itself keeps CI and the landing from drifting apart.
      - name: depot tests (.yardr/test, as for a landing)
        run: YARDR_LANDING=1 sh .yardr/test

  # What that run leaves out: the plain (non-race) build, and every package,
  # not just three, through the unix-socket client. The same steps as ci.yml's
  # test-plain job; keep the two in step.
  test-plain:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: go test
        run: go test ./...

  # The same steps as ci.yml's test-rpc job; keep the two in step.
  test-rpc:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: go test (rpc)
        run: YARDR_TEST_RPC=1 go test ./...

  # The same steps as ci.yml's conformance job; keep the two in step.
  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # The BDP commit conformance/bdp/README.md records as last verified:
      # a4fd83a, the Core era. Moving it is a deliberate change, made
      # together with the README, once probe-core.sh passes at the new commit.
      BDP_REF: a4fd83a2ce3bc77c28f98c5f023ade997e4a1642
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: gastownhall/bdp
          ref: ${{ env.BDP_REF }}
          path: bdp
      - name: README records the pin
        run: |
          grep -qF "$BDP_REF" conformance/bdp/README.md || {
            echo "conformance/bdp/README.md does not record BDP_REF ($BDP_REF); move them together"
            exit 1
          }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: bdp/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: bdp/.nvmrc
          cache: pnpm
          cache-dependency-path: bdp/pnpm-lock.yaml
      - name: build bdp
        working-directory: bdp
        run: pnpm install --frozen-lockfile && pnpm build
      - name: BDP probe failure paths
        run: conformance/bdp/probe-core-test.sh
      - name: BDP Core conformance
        run: BDP_REPO=$GITHUB_WORKSPACE/bdp conformance/bdp/probe-core.sh

  # The SBOM scanner is third-party code that only reads the source, so
  # it runs apart from the build: it shares neither the workspace whose
  # archives are attested (and uploaded from there) nor the build job's
  # id-token and attestations grants, which it never needs. The release
  # job waits for it, as it waited when the scan was a step of the build,
  # so a draft still means the scan passed.
  sbom:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: sbom the source
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: ./
          format: spdx-json
          # The draft holds the archives, checksums.txt and install.sh
          # alone (the site's sync refuses any other name in the
          # checksums); the SBOM is kept as a workflow artifact of this
          # job.
          upload-release-assets: "false"

  build:
    needs: [test, test-plain, test-rpc, conformance]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      # The attestation step mints an OIDC token and writes the attestations.
      id-token: write
      attestations: write
    env:
      # A dry run has no tag to take the version from.
      VERSION: ${{ github.event_name == 'push' && github.ref_name || 'v0.0.0-dryrun' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      # Reproducible archives: the build stamps every entry with the tagged
      # commit's time, so the same tag always makes the same bytes.
      - name: fix the build time to the commit
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >>"$GITHUB_ENV"
      # The script a person runs for the same build. It cross-compiles the
      # targets without cgo, stamps the version, runs the linux/amd64
      # binary's `yardr version` against it, and writes the archives and
      # checksums.txt to dist/.
      # The targets are the two linux ones and no darwin one: signing and
      # notarizing a darwin binary takes a Mac with the Developer ID, and
      # this runner is not one and holds no Apple identity. The release flow
      # builds the darwin archives on a Mac and adds them to the draft
      # (docs/install.md, "Making a release"). checksums.txt comes out
      # unsigned: the minisign key is not on this runner either, and the
      # checksums of a release are signed by hand afterwards
      # (docs/install.md, "Signed checksums").
      - name: build the archives
        env:
          YARDR_RELEASE_TARGETS: "linux/amd64 linux/arm64"
        run: contrib/release/build "$VERSION" dist
      # Only a tag attests; a dry run publishes nothing, not even attestations.
      # The archives are the two built above; the darwin ones the flow adds
      # carry no attestation, and its verify stage checks their signature and
      # notarization instead.
      - name: attest the archives
        if: github.event_name == 'push'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  release:
    # Only a tag publishes; a dry run ends with the artifacts above.
    if: github.event_name == 'push'
    needs: [build, sbom]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The one job that may write to the release, and it runs no code from
    # the repository: it only hands the built files to GitHub.
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          # v1.2.3-rc.1 is a pre-release: it never becomes "latest".
          prerelease=
          case "$TAG" in *-*) prerelease=--prerelease ;; esac
          # A re-run finds the draft its first run made and fills it again;
          # a published release is never touched.
          if existing=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$existing" = true ]; then
              gh release upload "$TAG" dist/*.tar.gz dist/checksums.txt dist/install.sh --clobber
            else
              echo "release $TAG is already published; not touching it" >&2
              exit 1
            fi
          else
            gh release create "$TAG" dist/*.tar.gz dist/checksums.txt dist/install.sh \
              --verify-tag --generate-notes --title "$TAG" --draft $prerelease
          fi
