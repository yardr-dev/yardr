name: ci

# Every uses: below is pinned by full commit SHA, with the release it is
# as a comment; a tag that moves would run code no review saw.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  # A push to main gets a group of its own, its commit, and a pull request one
  # per ref. Runs on main once shared a group, so the next push waited for the
  # run before it, and GitHub keeps only the newest of the runs that wait: an
  # older one was cancelled before it began a job, and the badge showed that
  # as failing though no test had failed. Now every push to main starts at
  # once, side by side, and is tested.
  group: ci-${{ github.event_name == 'push' && github.sha || github.ref }}
  # A pull request's run is cancelled when a newer push supersedes it. A run
  # on main is not: it is the backstop for what a landing leaves out
  # (docs/design/2026-10-14-yardr-022s-landing-tests.md, "The backstop"), and
  # a landing often follows the one before within the time a run takes, so
  # cancelling it at each push would leave none to finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The test run is three jobs, each with a limit of its own: the depot's
  # test command, and the two plain runs it leaves out. They were three steps
  # of one job. The first alone took most of that job's 15 minutes, so the
  # job was cut off, red with no test failing, before the others began or
  # while they ran. Apart, a leg that is slow or red hides none of the
  # others, and a run is as long as the longest leg, not the sum of the
  # three. release.yml has the same three; keep the two in step.
  #
  # The depot's test command as the assembly runs it on what lands: go
  # vet, go test -race over every package, and the store/dispatch/bdp
  # suites again through the unix-socket client. It is the whole suite
  # here because the checkout has no base to compare with. Running the
  # script itself keeps CI and the landing from drifting apart. It takes 11
  # to 14 minutes on a runner's four cores when it finishes. Its 30 minutes
  # are about twice the longest of those, because a run that outgrows its
  # limit is cut off, and a cut-off says nothing about the tests.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # go-version-file pins the toolchain go.mod names; cache keeps the
      # module and build caches keyed on go.sum.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "gofmt needed on:"
            echo "$out"
            exit 1
          fi
      - name: depot tests (.yardr/test, as for a landing)
        run: YARDR_LANDING=1 sh .yardr/test

  # What that run leaves out: the plain (non-race) build, and every package,
  # not just three, through the unix-socket client. Each is a job of its own,
  # so the rpc run no longer leans on results the plain run cached, and tests
  # every package. Each takes a fraction of the depot's run, and its limit is
  # lower for that.
  test-plain:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: go test
        run: go test ./...

  test-rpc:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: go test (rpc)
        run: YARDR_TEST_RPC=1 go test ./...

  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # The BDP commit conformance/bdp/README.md records as last verified:
      # a4fd83a, the Core era. Moving it is a deliberate change, made
      # together with the README, once probe-core.sh passes at the new commit.
      BDP_REF: a4fd83a2ce3bc77c28f98c5f023ade997e4a1642
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: gastownhall/bdp
          ref: ${{ env.BDP_REF }}
          path: bdp
      - name: README records the pin
        run: |
          grep -qF "$BDP_REF" conformance/bdp/README.md || {
            echo "conformance/bdp/README.md does not record BDP_REF ($BDP_REF); move them together"
            exit 1
          }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: bdp/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: bdp/.nvmrc
          cache: pnpm
          cache-dependency-path: bdp/pnpm-lock.yaml
      - name: build bdp
        working-directory: bdp
        run: pnpm install --frozen-lockfile && pnpm build
      - name: BDP probe failure paths
        run: conformance/bdp/probe-core-test.sh
      - name: BDP Core conformance
        run: BDP_REPO=$GITHUB_WORKSPACE/bdp conformance/bdp/probe-core.sh

  # The scans, apart from the test jobs so release.yml's copy of those jobs
  # stays in step with them: known vulnerabilities in what the module builds
  # with, what staticcheck finds in its Go, and the depot's shell.
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      # Pinned, like the actions above: @latest would run code no review saw.
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      # Pinned the same way, at the version the module was cleared with: a
      # newer one may report what this one does not, and that is a change of
      # its own. The module is clean of it, so a finding is a new one and
      # fails the job; a deliberate exception is a //lint:ignore with its
      # reason, on the line above (internal/cli/sourcecmd.go has one).
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...
      # The test gate, the installer and every contrib and conformance script
      # with a shell shebang, found by that line: a new script is covered
      # without touching this step. shellcheck reads the dialect from the
      # shebang, so install.sh is held to POSIX sh. shellcheck ships on the
      # runner's image; the install is for images without it.
      - name: shellcheck
        run: |
          command -v shellcheck >/dev/null || { sudo apt-get update && sudo apt-get install -y shellcheck; }
          grep -rlE '^#!(/bin/|/usr/bin/env )(sh|bash)' .yardr/test install.sh contrib conformance | xargs shellcheck

  # The darwin leg: the steps of the test jobs above, run on macOS, so that a
  # break only a Mac shows (a darwin-only syscall as in peer_darwin.go, a temp
  # path too long for a unix socket) is on the pull request and not first on a
  # Mac in the yard. It ran go vet and internal/peer alone while a runner's
  # minutes were counted; the standard runners cost none on a public
  # repository, so on a pull request it runs the lot. Keep the steps in step
  # with the test jobs', whose comments say what each is for.
  #
  # It is three jobs, as the linux run is, and for the same reason. The three
  # steps were one job with 30 minutes. The depot's tests took 9 minutes on a
  # macOS runner with five cores and 28 on one with three, and on a second one
  # with three they were still going at the limit. The job was cancelled with
  # no test failing, before the plain runs could finish. Apart, a slow leg
  # hides none of the others.
  #
  # The depot's run has 45 minutes, because 30 left too little room over the
  # 28 it took on three cores. A run that outgrows its limit is cut off, and a
  # cut-off says nothing about the tests.
  #
  # It runs on pull requests only. On a push to main it repeats what the
  # landing ran on a Mac in the yard, and at 23 to 38 minutes on a runner,
  # about twice the Linux run, it was the job a run on main waited for. On a
  # pull request it is the only Mac the change meets before review, so it
  # stays there. The two jobs below run on both: a landing leaves them out.
  test-macos:
    if: github.event_name == 'pull_request'
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "gofmt needed on:"
            echo "$out"
            exit 1
          fi
      # shellcheck is not on the macOS runner's image, as it is on the ubuntu
      # one, and the gate fails where it is missing instead of skipping, so it
      # is installed before the depot tests. Homebrew is on the image, and
      # needs no sudo.
      - name: shellcheck
        run: command -v shellcheck >/dev/null || brew install shellcheck
      - name: depot tests (.yardr/test, as for a landing)
        run: YARDR_LANDING=1 sh .yardr/test

  # What the depot's run leaves out: the plain (non-race) build, and every
  # package, not just three, through the unix-socket client. Each is a job of
  # its own with the 30 minutes the one job had. That is a guess until a green
  # run says how long each takes apart, and setup-go saves its cache only
  # after a success, so a run that times out leaves the next one as cold as
  # itself. Neither job installs shellcheck, because neither runs the gate.
  # The root package's tests that call the real tool skip without it, and
  # they run in test-macos, so on a Mac only for a pull request.
  test-macos-plain:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: go test
        run: go test ./...

  test-macos-rpc:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: go test (rpc)
        run: YARDR_TEST_RPC=1 go test ./...
