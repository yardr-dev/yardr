# Kimi Code. Every flag is from `kimi --help`.
version: 1
label: Kimi

# Kimi asks whether a folder is trusted the first time it is started in it
# ("Trust this folder?", read live, Kimi Code 2.1.1), and every bead is a new
# worktree, so every Kimi session stops there: yardr answers it
# (internal/runner/trust.go). Trust is per folder, not from a parent (with
# /Users/mckean trusted, new worktrees still asked), and
# KIMI_CODE_TRUST_WORKSPACE=1 does not skip the interactive dialog of 2.1.1
# (read live under a pty, 15 Oct 2026). Answering the dialog leaves Kimi's
# own trust record for Kimi to write.
trust:
  dialog: "Trust this folder?"
  answer: "Trust this folder"

# Kimi's input is a box (read live, Kimi Code 2.1.1),
#
#   ╭──────────────────────────╮
#   │ > half a thought that is │
#   │   long enough to wrap    │
#   ╰──────────────────────────╯
#
# and a message it took begins with "✨", not with the mark of its input.
# The input mark is asked for after the edge only: a ">" that begins a line
# is what many a transcript holds. Kimi draws no mark before an error, only
# space; the marks taken off are a box's edge and what any TUI may draw.
marks:
  input: ">"
  message: "✨"
  edge: "│"
  error: "⏺⎿●■•▌│┃✗✘⚠!"

flags:
  model: --model
  unattended: [--yolo]
  version: [--version]
  one_shot: [-p]
  permissions:
    - label: yolo
      args: [--yolo]
      description: auto-approves tool calls; may still ask questions
    - label: auto
      args: [--auto]
      description: fully autonomous; asks nothing

# Kimi prints `Error: [<code>] <message>`, the code from its own list, and
# breaks the line at the pane's width itself, which no unwrapped read mends:
# only the line's first part is there to match, so its lines are told by the
# code, and a usage limit (a 403, so provider.auth_error to Kimi) by the
# words that still stand before the break in a pane of 60 columns.
errors:
  - reason: rate_limited
    pattern: '^Error: \[provider\.auth_error\] 403 You.ve reached'
  - reason: rate_limited
    pattern: '^Error: \[provider\.rate_limit\]'
  - reason: at_capacity
    pattern: '^Error: \[provider\.overloaded\]'
  - reason: not_logged_in
    pattern: '^Error: \[(auth\.(login_required|token_missing|token_unauthorized)|provider\.auth_error)\]'

# Kimi answers a message that follows a long idle spell (longer than the
# model's cache lasts, with a context above a token threshold) with a menu
# drawn in place of its input, and keeps the message until it is answered
# (read live, Kimi Code 2.1.1, 7 Oct 2026):
#
#    This session has been idle for 44m and is ~198k tokens.
#    ↑↓ navigate · Enter select · Esc cancel
#    Cache expired — the next message re-sends the entire history at full price.
#     ❯ Compact and continue    one-time compact cost · cheapest way to keep this topic
#       Start a new session     zero context cost · best for a new task
#       Continue as-is          full history kept · highest cost per turn
#       Don't ask me again
#
# yardr tells of it and answers nothing: what the next message costs is for
# whoever runs the agent to choose. `cacheExpiryHint = false` in Kimi's
# tui.toml turns the menu off.
dialogs:
  - dialog: cache_menu
    pattern: '^This session has been idle for'
  - dialog: cache_menu
    pattern: '^Cache expired'

# What the menu above does to the prompt yardr gives when a usage limit's
# window has reset: the sentence goes into the hint of the event that tells
# of a prompt not taken.
hints:
  reset: Kimi asks what to do with a session that sat idle, and keeps the prompt until it is answered
