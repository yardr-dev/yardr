# opencode. Every flag is from `opencode --help`.
version: 1
label: opencode
# No provider: its README names no maker, only the OpenCode team.
install: https://opencode.ai

flags:
  model: --model
  version: [--version]
  one_shot: [run]
  permissions:
    - label: auto
      args: [--auto]
      description: auto-approves anything not explicitly denied
