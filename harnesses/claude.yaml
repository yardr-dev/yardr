# Claude Code. Every flag is from `claude --help`.
version: 1
label: Claude Code
provider: Anthropic
install: npm install -g @anthropic-ai/claude-code (https://claude.com/claude-code)

# On a Mac without a terminal (docs/doctor.md, "A program fetched on a Mac").
# Anthropic's own installer (https://claude.ai/install.sh) does this and no
# more: it downloads the binary of the version from downloads.claude.ai,
# checks it against the sha256 in that version's manifest.json, and runs it
# with `install <version>`, which puts the launcher at ~/.local/bin/claude,
# a link into ~/.local/share/claude/versions that Claude Code's own updates
# move. Read and run on 2026-10-13, on macOS 26.5.1 (arm64) in an empty
# home: it wrote no shell profile and changed none that was there, and says
# itself that ~/.local/bin is not on PATH. `install` needs the network: it
# fetches the version once more itself (with no network it fails, "connect
# ECONNREFUSED"), so what is checked here is the installer that is run, and
# what ends at ~/.local/bin/claude is Anthropic's own download of the same
# version. The sha256 below are that manifest's; the manifest is signed
# (manifest.json.sig, OpenPGP, key
# https://downloads.claude.ai/keys/claude-code.asc), and both binaries are
# signed by Developer ID Application: Anthropic PBC (Q6L2SF6YDW).
fetch:
  verified:
    from: https://code.claude.com/docs/en/setup
    on: 2026-10-13
  version: 2.1.296
  path: ~/.local/bin/claude
  run: [install, 2.1.296]
  targets:
    darwin/arm64:
      url: https://downloads.claude.ai/claude-code-releases/2.1.296/darwin-arm64/claude
      sha256: c9b5341637becbd423ddffc5b254afb645682a3868cb708bbc6cc0e7bb419937
      size: 240664432
    darwin/amd64:
      url: https://downloads.claude.ai/claude-code-releases/2.1.296/darwin-x64/claude
      sha256: a6bf4f30be241053a923f3820ad23c5991d2f5ac2935b3a8dd64da218d9cc603
      size: 249194752

# Claude Code asks whether a folder is trusted the first time it is started
# in it, and has no flag that skips the question: yardr answers it
# (internal/runner/trust.go). The dialog is the start of its question, the
# answer the one that accepts it, the cursor the mark of its selected
# answer, as 2.1.288 prints them. The question's parenthetical tail wraps
# wherever the pane wraps, so the whole question never sits on one row;
# only its start marks the dialog at every width (yardr-q7rd).
trust:
  dialog: "Quick safety check:"
  answers: ["Yes, I trust this folder"]
  cursor: "❯"

# Claude Code begins a message it took with the mark of its input. Before a
# message of its own it draws ⏺ or ⎿; the other marks are a box's edge and
# what any TUI may draw before an error.
marks:
  input: "❯"
  message: "❯"
  error: "⏺⎿●■•▌│┃✗✘⚠!"

flags:
  model: --model
  unattended: [--permission-mode, auto]
  version: [--version]
  one_shot: [-p]
  permissions:
    - label: auto
      args: [--permission-mode, auto]
      description: Claude judges each action; asks only about risky ones
    - label: accept edits
      args: [--permission-mode, acceptEdits]
      description: file edits allowed; shell commands still ask
    - label: bypass
      args: [--dangerously-skip-permissions]
      description: never asks; runs as you with full access
    # For an agent that reads what a stranger wrote: Claude Code's own
    # sandbox around every shell command, with the working directory denied
    # for writing too. Inside it nothing is written and nothing reaches the
    # network or a unix socket but the yard's, which every yardr command of
    # the session goes through: {socket} is its path, put in by the runner.
    # {workdir} is the directory the session works in, put in the same way:
    # the sandbox does not take "." for it, and a write there went through.
    # Run against 2.1.288.
    - label: read only
      args: [--settings, '{"sandbox":{"enabled":true,"filesystem":{"denyWrite":["{workdir}"]},"network":{"allowUnixSockets":["{socket}"]}}}']
      description: reads in a read-only sandbox, no network but the yard's socket; asks for anything else

# The models to pick from: the aliases `claude --help` names for --model
# ("an alias for the latest model (e.g. 'fable', 'opus', or 'sonnet') or a
# model's full name"), read with Claude Code 2.1.288 on 2026-10-15. An alias
# does not go stale when a version ships; each label is what it resolved to
# in recent session files on that date.
offers:
  - model: opus
    label: Opus 5.5
    recommended: yardmaster
  - model: fable
    label: Fable 5.1
  - model: sonnet
    label: Sonnet 5

# The model of the first assistant message, which is what the API answered
# with. Claude Code's own message (an API error shown as a reply) names
# "<synthetic>", which is no model: a name that begins with "<" is passed
# over for every kind.
model:
  home: .claude
  home_env: CLAUDE_CONFIG_DIR
  glob: projects/*/{session}.jsonl
  type: assistant
  field: message.model

# A line that says two things (an API error that ends in "Please run
# /login") is listed under the one that matters before the general one.
errors:
  - reason: not_logged_in
    pattern: '^(Not logged in|You are not logged in|Invalid API key|Please run /login)'
  - reason: not_logged_in
    pattern: '^(Your session has expired|Session expired)\. Please run /login'
  - reason: not_logged_in
    pattern: '^API Error.*(Please run /login|authentication_error)'
  - reason: rate_limited
    pattern: '^You.ve hit your '
  - reason: rate_limited
    pattern: '^(Claude usage|Usage|5-hour|Weekly|Session|Fable|Opus|Sonnet|Fast) limit reached'
  - reason: rate_limited
    pattern: '^API Error.*(\b429\b|rate_limit_error|Rate limit)'
  - reason: at_capacity
    pattern: '^Repeated 529 Overloaded errors'
  - reason: at_capacity
    pattern: '^API Error.*(\b529\b|overloaded_error|Overloaded)'
  - reason: other
    pattern: '^There''s an issue with the selected model'
  - reason: other
    pattern: '^Credit balance (is )?too low'
  - reason: other
    pattern: '^API Error'

# Claude Code's login screen, drawn in place of its input when it has no
# login (read live, Claude Code 2.1.288, 12 Oct 2026, with no credentials):
# a menu of login methods, then the browser sign-in with a code to paste.
# The menu's selected option carries the mark of the input, so without
# these lines the screen reads as text in the input. yardr types nothing
# there and tells of it as not logged in.
login:
  - pattern: '^Select login method:'
  - pattern: '^Paste code here if prompted'

# Claude Code's own login command, for a program that leads the login of a
# person with no terminal (yardr harness login claude --json; docs/doctor.md,
# "A harness's login led by a program"). Run on 13 Oct 2026 with Claude Code
# 2.1.288, with no credentials, in an empty home, on pipes with no terminal
# and with a stand-in for the browser's opener:
#   $ claude auth login
#   Opening browser to sign in…
#   If the browser didn't open, visit: https://claude.com/cai/oauth/authorize?code=true&...
#   Paste code here if prompted >
# It draws no menu: the method the login screen above asks for is a flag
# (`claude auth login --help`), and it asks nothing of a terminal. It opens
# the browser itself on a page that ends the login by itself (it answers to
# a port on localhost the command listens on); the address it prints is of
# the same sign-in, and ends on a page that shows a code, which the command
# reads as one line on stdin while it waits. A line that is no code ends it
# with `Login failed: Request failed with status code 400` and status 1.
# What it prints when a login is made was not run: no builder logs in.
# With --console the page it opens is on platform.claude.com. --sso and
# --email were not run and are no method here.
login_recipe:
  verified:
    from: claude auth login, Claude Code 2.1.288
    on: 2026-10-13
  argv: [auth, login]
  methods:
    - label: Claude subscription
      args: [--claudeai]
    - label: Anthropic Console (API usage billing)
      args: [--console]
  open_url: '^If the browser didn.t open, visit: (https://\S+)$'
  input: '^Paste code here if prompted'

# Claude Code's offer to run /auto-mode-setup, drawn in place of its input
# at the end of a turn once auto mode has blocked several actions and
# ~/.claude/settings.json has no autoMode.environment (seen in a builder's
# pane, 12 Oct 2026, Claude Code 2.1.288). Its selected answer carries the
# mark of the input, and its answers are chosen by their digits. The runner
# sends Esc to cancel it without changing the operator's settings.
dialogs:
  - dialog: auto_mode_setup
    pattern: '^Teach auto mode about your environment\?'

# What Claude Code draws while a command its agent started in the background
# still runs (seen in two builders' panes, 13 Oct 2026, Claude Code 2.1.288):
# the line that ends the turn, above the input, and the status line under it.
#   ✻ Brewed for 48s · done 12:44 AM · 1 shell still running
#   ⏵⏵ auto mode on · 1 shell · ← 1 agent · ↓ to manage
# Claude Code wakes the agent when the shell exits, so the agent is not idle
# to the group's idle limit while either shows.
background:
  - pattern: ' · \d+ shells? still running$'
  - pattern: '(^| · )\d+ shells?( · |$)'
