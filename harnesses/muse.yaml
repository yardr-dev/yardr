# Muse Code. Every flag is from `muse --help`.
version: 1
label: Muse Code
provider: Meta

# Muse asks whether a workspace is trusted the first time it is started in
# it ("Do you trust this workspace?", read live, Muse Code 1.4.9), and
# every bead is a new worktree, so every Muse session stops there: yardr
# answers it (internal/runner/trust.go). The dialog opens with its cursor
# on the accepting answer, and the cursor wraps neither way, so a dialog
# whose cursor is off the answer is left for a human (read live, four
# launches and both arrow keys). Answering the dialog writes the
# workspace's decision to Muse's trust store (~/.config/muse/trust.json,
# one decision per folder) for Muse to keep; --yolo and --trust-workspace
# trust the workspace for the run without writing it (`muse --help`).
# The dialog's cursor is ⟩, as its other menus', though its input mark
# (below) is ❯.
trust:
  dialog: "Do you trust this workspace?"
  answers: ["1  Trust and continue"]
  cursor: "⟩"

# Muse's input is one line at the bottom of its pane (read live, Muse Code
# 1.4.9),
#
#   ── Voice input (alt(option)+v to start) ──…
#   ❯
#   ───…
#     muse-spark-1.3 · max · /private/tmp/…/work · Auto-review
#
# and a message it took begins with the mark of its input. A message of
# its own, and the line it works behind ("◆ Thinking (3s · esc to
# interrupt)"), begins with ◆. The other marks taken off an error line
# are what any TUI may draw.
#
# 1.4.11 draws a hint after the mark while the input holds nothing ("Ask to
# monitor a running build or log and get pinged on changes", read live with
# `herdr pane read --format ansi`, 21 Oct 2026), in a truecolor grey
# (38;2;103;108;116), not faint, which Esc does not clear. The hint comes
# and goes and its words are likely not fixed, so the colour is named
# below, not the words: text drawn in it reads as no text. What a person
# types is drawn in 38;2;204;211;219 instead (a word typed in a scratch
# pane the same day, then cleared).
marks:
  input: "❯"
  message: "❯"
  placeholder_sgr: "38;2;103;108;116"
  error: "◆⏺⎿●■•▌│┃✗✘⚠!"

flags:
  model: --model
  unattended: [--yolo]
  version: [--version]
  one_shot: [exec]
  permissions:
    - label: yolo
      args: [--yolo]
      description: never asks, no sandbox, trusts the workspace for the run
    - label: no approval
      args: [--disable-approval]
      description: no approval prompts; the sandbox still applies

# The models to pick from: the yard's own (muse-spark-1.3-contributor:
# model muse-spark-1.3 with contributor mode on,
# ~/.config/muse/settings.json of 2026-10-15) and the catalog's newer
# default (muse-wonder-1.0, is_default, released 2026-10-12), both spelled
# as the model catalog does (~/.local/share/muse/model-catalog/*.json,
# provider meta, read 2026-10-15). Each label shortens its id, as the
# TUI's footer shortens the running model (muse-spark-1.3 for a run of
# muse-spark-1.3-contributor, read live, Muse Code 1.4.9).
offers:
  - model: muse-spark-1.3-contributor
    label: Spark 1.3 Contributor
    recommended: yardmaster
  - model: muse-wonder-1.0
    label: Wonder 1.0

# The model the agent runs, as its session file says it: the model_id of
# the first run.model.configured line, which is what the run was started
# or reconfigured with. The lines name their type "payload_type", not
# "type" (read live, Muse Code 1.4.9, 16 Oct 2026:
# ~/.local/share/muse/sessions/<y>/<m>/<d>/<id>/session.jsonl).
# runtime.session.metadata is not read: it names the startup model, and a
# live session reconfigured mid-run (01a12592) still shows its startup
# model there while run.model.configured names the running one. `muse
# --help` names no environment variable for the home, so there is no
# home_env. herdr 0.9.0 reports no session id for Muse panes, so this
# reads nothing until herdr learns its sessions.
model:
  home: .local/share/muse
  glob: sessions/*/*/*/{session}/session.jsonl
  type_field: payload_type
  type: run.model.configured
  field: payload.record.model_id

# Muse's login screen, drawn in place of its input when it has no login
# (read live, Muse Code 1.4.9, 16 Oct 2026, with no credentials: empty
# HOME, TBH_CREDENTIAL_BACKEND=file, past the trust dialog with Enter):
# two login methods and a footer, each row indented two spaces. The
# selected method is marked by style alone (no cursor glyph, before or
# after the arrow keys move it), and the "· Enter to choose" hint follows
# the selection, so each method matches with and without it. The "Muse
# Code 1.4.9" header above them names the app, not the screen, and its
# version changes, so it is no line here. yardr types nothing there and
# tells of it as not logged in.
login:
  - pattern: '^(Log in with browser|Set an API key)'
  - pattern: '^↓↑ to select · Esc to quit'

# The lines a Muse pane stops on. `muse exec` fails out loud (missing
# meta credentials, a model that does not exist), but the TUI shows its
# login screen for the first and answers anyway for the second (read
# live, Muse Code 1.4.9), so neither line ever ends a pane; a dead base
# URL warns once at startup and its turns answer too. The lines read
# from panes that sat on them are failed turns: the model answered
# nothing, with a request id to find it by (a builder's, 17 Oct 2026,
# Muse Code 1.4.10, yardr-thet: `model failed: server_error: ...`; a
# builder's, 17 Oct 2026, yardr-k1nf: `model failed: stream protocol
# error: function_call_arguments.done name mismatch ...`). Every
# `model failed:` line is one: no rate limit or capacity of Muse's is
# known to print under it, so there is no narrower reason to keep first.
# It is no capacity yardr retries, as a 529 is, but a turn that failed,
# as claude's API Error: 500 is: other.
errors:
  - reason: other
    pattern: '^model failed:'

# What Muse Code draws while a command its agent started in the background
# still runs (read live from a builder's pane w114:p2, 20 Oct 2026, Muse
# Code 1.4.9): the status line under its input, the command's title with
# the status word "running" and how long it has run.
#   main · ↓ to select
#   └ ◆ Run depot test gate in worktree  running                     14m 01s
# Muse wakes the agent when the command exits, so the agent is not idle
# to the group's idle limit while it shows. The transcript's "Backgrounded
# · <title> · <elapsed> · ctrl+o" line is no pattern here: it stays on
# screen after the command exits.
background:
  - pattern: '^└ ◆ .+ running +\d+[smh]( +\d+[ms])?$'
